kind: app
version: '0.1.5'
app:
  name: 구매요청 자동 분석 및 업체 추천
  description: 구매요청서를 업로드하면 공사내용을 자동 분석하고 최적 업체를 추천하는 워크플로우
  mode: workflow
  icon: "\U0001F4CB"
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
workflow:
  features:
    file_upload:
      allowed_file_extensions:
        - .pdf
        - .docx
        - .doc
        - .hwp
      allowed_file_types:
        - document
      allowed_file_upload_methods:
        - local_file
      fileUploadConfig:
        file_size_limit: 15
        batch_count_limit: 5
      number_limits: 1
      image:
        enabled: false
  environment_variables: []
  conversation_variables: []
  graph:
    nodes:
      # ================================================================
      # 노드 1: 시작 - 사용자 입력 (구매요청서 파일 + 추가 요구사항)
      # ================================================================
      - data:
          title: 시작
          type: start
          variables:
            - type: file
              variable: purchase_request
              label: 구매요청서
              required: true
              description: 공사내용이 담긴 구매요청서 문서 (PDF, DOCX, HWP)
              max_length: null
              options: []
              allowed_file_types:
                - document
              allowed_file_extensions:
                - .pdf
                - .docx
                - .doc
                - .hwp
              allowed_file_upload_methods:
                - local_file
            - type: text-input
              variable: additional_requirements
              label: 추가 요구사항
              required: false
              description: 특별히 고려해야 할 사항이나 우선순위 (선택 입력)
              max_length: 2000
              options: []
              default: ''
        height: 118
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 2: 문서 텍스트 추출 (Document Extractor)
      # ================================================================
      - data:
          title: 문서 텍스트 추출
          type: document-extractor
          variable_selector:
            - start
            - purchase_request
          is_array_file: false
        height: 54
        id: doc_extractor
        position:
          x: 380
          y: 282
        positionAbsolute:
          x: 380
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 3: 공사내용 분석 (LLM)
      # - 구매요청서 텍스트에서 공사 종류, 규모, 기술 요구사항 등 추출
      # - 모델/provider를 실제 환경에 맞게 변경하세요
      # ================================================================
      - data:
          title: 공사내용 분석
          type: llm
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.2
              top_p: 1
              frequency_penalty: 0
              presence_penalty: 0
              max_tokens: 4096
          prompt_template:
            - id: system-msg
              role: system
              text: >-
                당신은 건설/시설 공사 분야의 전문 분석가입니다.

                구매요청서의 내용을 분석하여 공사의 핵심 정보를 정확하게 추출합니다.


                다음 항목들을 반드시 분석하세요:

                1. 공사 종류 (건축, 토목, 기계, 전기, 설비, 조경, 기타)

                2. 공사 규모 (예상 금액 범위, 면적, 기간)

                3. 기술 요구사항 (필요 자격, 특수 장비, 기술 수준)

                4. 공사 위치 및 현장 조건

                5. 주요 공사 항목 (세부 작업 리스트)

                6. 특이사항 및 리스크 요소

                7. 납기/공기 요건


                반드시 아래 JSON 형식으로 응답하세요:

                ```json

                {
                  "construction_type": "공사 종류",
                  "construction_subtypes": ["세부 공종1", "세부 공종2"],
                  "scale": {
                    "estimated_budget_range": "예상 금액 범위",
                    "area": "면적 정보",
                    "duration": "공사 기간"
                  },
                  "technical_requirements": {
                    "qualifications": ["필요 자격1", "필요 자격2"],
                    "special_equipment": ["특수 장비1"],
                    "skill_level": "상/중/하"
                  },
                  "location": "공사 위치",
                  "site_conditions": "현장 조건 설명",
                  "work_items": ["주요 공사 항목1", "주요 공사 항목2"],
                  "special_notes": ["특이사항1", "특이사항2"],
                  "risk_factors": ["리스크1", "리스크2"],
                  "deadline": "납기/공기 정보",
                  "summary": "전체 요약 (2~3문장)"
                }

                ```
            - id: user-msg
              role: user
              text: >-
                ## 구매요청서 내용:

                {{#doc_extractor.text#}}


                ## 추가 요구사항:

                {{#start.additional_requirements#}}


                위 구매요청서를 분석하여 JSON 형식으로 결과를 제공해주세요.
          memory: null
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
            configs:
              detail: high
        height: 98
        id: analyze_document
        position:
          x: 680
          y: 282
        positionAbsolute:
          x: 680
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 4: 분석 결과 파싱 (Code)
      # - LLM 응답에서 JSON 추출 → 구조화 데이터 변환
      # - Knowledge Base 검색 쿼리 생성
      # ================================================================
      - data:
          title: 분석 결과 파싱
          type: code
          variables:
            - variable: analysis_text
              value_selector:
                - analyze_document
                - text
          code_language: python3
          code: >-
            import json

            import re


            def main(analysis_text: str) -> dict:
                """LLM 분석 결과에서 JSON을 추출하고 검증합니다."""
                try:
                    # JSON 블록 추출 (```json ... ``` 또는 순수 JSON)
                    json_match = re.search(r'```json\s*(.*?)\s*```', analysis_text, re.DOTALL)
                    if json_match:
                        json_str = json_match.group(1)
                    else:
                        # 중괄호로 시작/끝나는 JSON 직접 추출
                        json_match = re.search(r'\{.*\}', analysis_text, re.DOTALL)
                        if json_match:
                            json_str = json_match.group(0)
                        else:
                            return {
                                "parsed_analysis": "{}",
                                "construction_type": "분석 실패",
                                "search_query": analysis_text[:200],
                                "is_valid": False,
                                "estimated_budget": "미확인"
                            }

                    parsed = json.loads(json_str)

                    # 업체 검색용 쿼리 구성 (공사종류 + 세부공종 + 필요자격)
                    search_parts = []
                    if parsed.get("construction_type"):
                        search_parts.append(parsed["construction_type"])
                    for subtype in parsed.get("construction_subtypes", []):
                        search_parts.append(subtype)
                    for qual in parsed.get("technical_requirements", {}).get("qualifications", []):
                        search_parts.append(qual)
                    search_query = " ".join(search_parts) if search_parts else "일반 공사"

                    # 예상 금액 추출
                    estimated_budget = parsed.get("scale", {}).get("estimated_budget_range", "미확인")

                    return {
                        "parsed_analysis": json.dumps(parsed, ensure_ascii=False),
                        "construction_type": parsed.get("construction_type", "미분류"),
                        "search_query": search_query,
                        "is_valid": True,
                        "estimated_budget": estimated_budget
                    }
                except (json.JSONDecodeError, AttributeError):
                    return {
                        "parsed_analysis": "{}",
                        "construction_type": "파싱 오류",
                        "search_query": analysis_text[:200],
                        "is_valid": False,
                        "estimated_budget": "미확인"
                    }
          outputs:
            parsed_analysis:
              type: string
              children: null
            construction_type:
              type: string
              children: null
            search_query:
              type: string
              children: null
            is_valid:
              type: boolean
              children: null
            estimated_budget:
              type: string
              children: null
        height: 54
        id: format_analysis
        position:
          x: 980
          y: 282
        positionAbsolute:
          x: 980
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 5: 업체 평가 데이터 검색 (Knowledge Retrieval)
      # - Knowledge Base에 vendor_evaluation.csv 업로드 후 dataset_id 교체 필수
      # ================================================================
      - data:
          title: 업체 평가 데이터 검색
          type: knowledge-retrieval
          query_variable_selector:
            - format_analysis
            - search_query
          dataset_ids:
            - YOUR_DATASET_ID_HERE
          retrieval_mode: multiple
          single_retrieval_config:
            model:
              provider: openai
              name: gpt-4o-mini
              mode: chat
              completion_params:
                temperature: 0
                max_tokens: 1000
          multiple_retrieval_config:
            top_k: 10
            score_threshold: 0.5
            reranking_enable: false
            reranking_model:
              provider: ''
              model: ''
            reranking_mode: null
            weights: null
        height: 54
        id: vendor_search
        position:
          x: 1280
          y: 282
        positionAbsolute:
          x: 1280
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 6: 업체 추천 (LLM)
      # - 분석 결과 + 업체 데이터 → 3~5개 업체 추천 및 선정 근거 생성
      # ================================================================
      - data:
          title: 업체 추천
          type: llm
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.3
              top_p: 1
              frequency_penalty: 0
              presence_penalty: 0
              max_tokens: 4096
          prompt_template:
            - id: system-msg-2
              role: system
              text: >-
                당신은 건설/시설 공사 업체 선정 전문가입니다.

                공사내용 분석 결과와 업체 평가 데이터를 종합하여 최적의 업체를 추천합니다.


                추천 시 다음 기준을 종합 평가하세요:

                1. 공종 적합성: 해당 공사 종류의 시공 실적 보유 여부

                2. 기술 역량: 필요 자격 및 장비 보유 여부

                3. 과거 실적 평가: 기존 계약 이행 평가 점수

                4. 가격 경쟁력: 과거 유사 공사 낙찰률/견적 수준

                5. 신용/안정성: 경영 상태, 하자보수 이행률


                반드시 아래 JSON 형식으로 3~5개 업체를 추천하세요:

                ```json

                {
                  "recommendations": [
                    {
                      "rank": 1,
                      "company_name": "업체명",
                      "match_score": 95,
                      "strengths": ["강점1", "강점2"],
                      "weaknesses": ["약점1"],
                      "past_performance": "관련 실적 요약",
                      "evaluation_score": 92.5,
                      "recommendation_reason": "추천 근거 상세 설명"
                    }
                  ],
                  "selection_criteria": "선정 기준 요약",
                  "additional_considerations": "추가 고려사항"
                }

                ```
            - id: user-msg-2
              role: user
              text: >-
                ## 공사내용 분석 결과:

                {{#format_analysis.parsed_analysis#}}


                ## 업체 평가 데이터:

                {{#vendor_search.result#}}


                ## 추가 요구사항:

                {{#start.additional_requirements#}}


                위 정보를 바탕으로 최적의 입찰업체를 추천해주세요.
          memory: null
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
            configs:
              detail: high
        height: 98
        id: recommend_vendor
        position:
          x: 1580
          y: 282
        positionAbsolute:
          x: 1580
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 7: 최종 결과 포맷팅 (Code)
      # - 분석 + 추천 결과 통합 JSON 생성
      # - 고액 계약 여부 판별 (1억 이상)
      # ================================================================
      - data:
          title: 최종 결과 포맷팅
          type: code
          variables:
            - variable: analysis_json
              value_selector:
                - format_analysis
                - parsed_analysis
            - variable: recommendation_text
              value_selector:
                - recommend_vendor
                - text
            - variable: construction_type
              value_selector:
                - format_analysis
                - construction_type
            - variable: estimated_budget
              value_selector:
                - format_analysis
                - estimated_budget
          code_language: python3
          code: >-
            import json

            import re

            from datetime import datetime


            def main(analysis_json: str, recommendation_text: str, construction_type: str, estimated_budget: str) -> dict:
                """분석 결과와 추천 결과를 최종 JSON으로 통합합니다."""

                # 1. 분석 결과 파싱
                try:
                    analysis = json.loads(analysis_json)
                except json.JSONDecodeError:
                    analysis = {"error": "분석 결과 파싱 실패"}

                # 2. 추천 결과 파싱
                try:
                    json_match = re.search(r'```json\s*(.*?)\s*```', recommendation_text, re.DOTALL)
                    if json_match:
                        recommendation = json.loads(json_match.group(1))
                    else:
                        json_match = re.search(r'\{.*\}', recommendation_text, re.DOTALL)
                        if json_match:
                            recommendation = json.loads(json_match.group(0))
                        else:
                            recommendation = {"error": "추천 결과 파싱 실패", "raw": recommendation_text[:500]}
                except (json.JSONDecodeError, AttributeError):
                    recommendation = {"error": "추천 결과 파싱 실패"}

                # 3. 고액 계약 여부 판별 (1억원 이상)
                is_high_value = False
                budget_str = estimated_budget.replace(",", "").replace(" ", "")
                if "억" in budget_str:
                    is_high_value = True
                numbers = re.findall(r'[\d.]+', budget_str)
                for num_str in numbers:
                    try:
                        num = float(num_str)
                        if "만" in budget_str and num >= 10000:
                            is_high_value = True
                        elif num >= 100000000:
                            is_high_value = True
                    except ValueError:
                        pass

                # 4. 1순위 업체명 추출
                recommendations_list = recommendation.get("recommendations", [])
                if recommendations_list:
                    top_vendor = recommendations_list[0].get("company_name", "해당없음")
                else:
                    top_vendor = "추천 업체 없음"

                # 5. 최종 결과 조합
                final_result = {
                    "status": "success",
                    "generated_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                    "analysis": analysis,
                    "recommendation": recommendation,
                    "metadata": {
                        "construction_type": construction_type,
                        "estimated_budget": estimated_budget,
                        "is_high_value_contract": is_high_value,
                        "recommended_vendor_count": len(recommendations_list)
                    }
                }

                return {
                    "result_json": json.dumps(final_result, ensure_ascii=False, indent=2),
                    "is_high_value": is_high_value,
                    "top_vendor": top_vendor
                }
          outputs:
            result_json:
              type: string
              children: null
            is_high_value:
              type: boolean
              children: null
            top_vendor:
              type: string
              children: null
        height: 54
        id: format_output
        position:
          x: 1880
          y: 282
        positionAbsolute:
          x: 1880
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 8: 조건 분기 - 고액 계약이면 알림 발송
      # ================================================================
      - data:
          title: 고액 계약 확인
          type: if-else
          conditions:
            - id: high_value_true
              logical_operator: and
              conditions:
                - comparison_operator: is
                  value: 'true'
                  variable_selector:
                    - format_output
                    - is_high_value
                  id: cond-1
        height: 126
        id: check_notification
        position:
          x: 2180
          y: 282
        positionAbsolute:
          x: 2180
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 9-A: 알림 발송 (HTTP Request - Slack Webhook)
      # - 고액 계약일 때만 실행
      # - URL을 실제 Slack Webhook URL로 교체하세요
      # ================================================================
      - data:
          title: 알림 발송
          type: http-request
          method: post
          url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
          authorization:
            type: no-auth
            config: null
          headers: ''
          params: ''
          body:
            type: json
            data:
              - key: text
                type: text
                value: >-
                  [고액 계약 알림]
                  공사 종류: {{#format_analysis.construction_type#}}
                  예상 금액: {{#format_analysis.estimated_budget#}}
                  추천 1순위 업체: {{#format_output.top_vendor#}}
                  상세 결과를 확인하세요.
          timeout:
            connect: 10
            read: 30
            write: 30
          mask:
            enabled: false
        height: 54
        id: send_notification
        position:
          x: 2480
          y: 182
        positionAbsolute:
          x: 2480
          y: 182
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 9-B: 결과 저장용 알림 (HTTP Request)
      # - 분석 완료 알림 또는 외부 저장소 API 호출
      # - URL을 실제 환경에 맞게 교체하세요
      # ================================================================
      - data:
          title: 결과 저장 알림
          type: http-request
          method: post
          url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
          authorization:
            type: no-auth
            config: null
          headers: ''
          params: ''
          body:
            type: json
            data:
              - key: text
                type: text
                value: >-
                  [구매요청 분석 완료]
                  공사 종류: {{#format_analysis.construction_type#}}
                  추천 1순위 업체: {{#format_output.top_vendor#}}
          timeout:
            connect: 10
            read: 30
            write: 30
          mask:
            enabled: false
        height: 54
        id: save_result
        position:
          x: 2480
          y: 382
        positionAbsolute:
          x: 2480
          y: 382
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 10-A: 종료 (고액 알림 경로)
      # ================================================================
      - data:
          title: 종료 (고액)
          type: end
          outputs:
            - variable: result
              value_selector:
                - format_output
                - result_json
        height: 90
        id: end_high
        position:
          x: 2780
          y: 182
        positionAbsolute:
          x: 2780
          y: 182
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ================================================================
      # 노드 10-B: 종료 (일반 경로)
      # ================================================================
      - data:
          title: 종료 (일반)
          type: end
          outputs:
            - variable: result
              value_selector:
                - format_output
                - result_json
        height: 90
        id: end_normal
        position:
          x: 2780
          y: 382
        positionAbsolute:
          x: 2780
          y: 382
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

    # ================================================================
    # 엣지 연결 정의
    # ================================================================
    edges:
      - id: start->doc_extractor
